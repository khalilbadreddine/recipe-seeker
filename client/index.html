<!doctype html>
<!-- suppressHydrationWarning: the inline js-anim script below mutates <html>
     before React hydrates; this tells React the class list may differ. -->
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <!-- js-anim gate: enables scroll-reveal hidden states ONLY when JS runs.
         Prerendered HTML / no-JS crawlers never get this class, so content is
         never invisible by default. Runs before first paint: no flash. -->
    <script>document.documentElement.classList.add('js-anim')</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F6F4EE" />
    <!-- Pinterest domain verification -->
    <meta name="p:domain_verify" content="32ee16b2f24e288586444a952b1a6bdb" />
    <!-- Fonts: Bricolage Grotesque (display) + Inter (body). Fallback: system sans. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Vercel Web Analytics (cookieless). Enable it once in Vercel → Project → Analytics. -->
    <script defer src="/_vercel/insights/script.js"></script>
    <!--ssr-head-->
  </head>
  <body>
    <div id="root"><!--ssr-body--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
