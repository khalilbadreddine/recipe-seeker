<!doctype html>
<!-- suppressHydrationWarning: the inline js-anim script below mutates <html>
     before React hydrates; this tells React the class list may differ. -->
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <!-- js-anim gate: enables scroll-reveal hidden states ONLY when JS runs.
         Prerendered HTML / no-JS crawlers never get this class, so content is
         never invisible by default. Runs before first paint: no flash. -->
    <script>document.documentElement.classList.add('js-anim')</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E4633" />
    <!-- Fonts: Fraunces (display serif) + Inter (body sans). Fallbacks: Georgia / system sans. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--ssr-head-->
  </head>
  <body>
    <div id="root"><!--ssr-body--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
